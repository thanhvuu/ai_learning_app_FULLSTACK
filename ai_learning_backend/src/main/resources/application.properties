server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_learning_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.pool-name=ai-learning-db-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

server.tomcat.threads.max=${SERVER_THREADS_MAX:200}
server.tomcat.threads.min-spare=${SERVER_THREADS_MIN:20}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:5s}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:12MB}

gemini.api.key=${GEMINI_API_KEY}
